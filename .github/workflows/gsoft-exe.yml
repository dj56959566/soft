# 打包 clean_repos.py 为 Windows exe（PyInstaller）
# 用不用？看下面判断，不用就别把这个文件推到仓库里。
#
# 要打包的情况：
#   - 想发给没装 Python 的 Windows 用户，双击就能跑
#   - 想把工具当成品分发，不想让对方看到/改源码
# 不用打包的情况（推荐直接用 Python）：
#   - 只是你自己在 Serv00 / N1 / 本机跑，python3 clean_repos.py 就行
#   - exe 每次改代码都要重新打包，而且 Windows Defender 常误报 PyInstaller 的 exe
#   - 这个脚本只有标准库，打包后 exe 约 8-15MB，启动还比 python 慢
#
# 用法：
#   1. 把这个文件放到仓库的 .github/workflows/build-exe.yml
#   2. 手动跑：仓库 Actions 页 → Build EXE → Run workflow
#      或打 tag：git tag v1.1 && git push origin v1.1，会自动在 Release 里附上 exe
#   3. 跑完在 Actions 那次运行的 Artifacts 里下载 github-repo-cleaner-windows.zip，
#      解压得到 github-repo-cleaner.exe，双击会闪退是正常的——它是命令行工具，
#      要在 cmd / PowerShell 里跑：.\github-repo-cleaner.exe --help
#      token 还是用环境变量：set GITHUB_TOKEN=ghp_xxxx
name: Build Gsoft.EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: pip install pyinstaller
      - name: 打包成单个 exe
        run: pyinstaller --onefile --console --name github-repo-cleaner clean_repos.py
      - name: 上传 exe（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: github-repo-cleaner-windows
          path: dist/github-repo-cleaner.exe
      - name: 发到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github-repo-cleaner.exe
