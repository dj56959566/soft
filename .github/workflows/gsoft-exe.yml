# 打包 gsoft/clean_repos.py 为 Windows exe（PyInstaller）
# 已按 soft 仓库实际结构修好：脚本在 gsoft/ 子目录，不在根目录，
# 所以打包命令用的是 gsoft/clean_repos.py，不是 clean_repos.py。
# 用法：把这个文件覆盖到仓库的 .github/workflows/gsoft-exe.yml，
# 然后去 Actions 页 → Build Gsoft.EXE → Run workflow 手动跑一次。
# 跑完在 Artifacts 里下载 github-repo-cleaner-windows.zip，
# 解压得到 github-repo-cleaner.exe，双击进中文菜单，先问你要 Token。
name: Build Gsoft.EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: pip install pyinstaller
      - name: 打包成单个 exe
        run: pyinstaller --onefile --console --name github-repo-cleaner gsoft/clean_repos.py
      - name: 上传 exe（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: github-repo-cleaner-windows
          path: dist/github-repo-cleaner.exe
      - name: 发到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github-repo-cleaner.exe
